name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tooling
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Run examples
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
      - name: CLI smoke test
        run: python -m joons_allocator --help

  with-guard:
    name: with-guard / ubuntu-latest / python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with optional guard integration
        run: python -m pip install --disable-pip-version-check -e ".[test,guard]"
      - name: Run test suite
        run: python -m pytest -q
